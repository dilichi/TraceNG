<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Journeys | TraceNG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/transitions.css">

    <style>
        body {
            background-color: #071326;
            color: #ffffff;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Navigation Styles matching your other pages */
        .navbar {
            background: #050c19;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .navbar .container {
            max-width: 1600px;
        }

        .navbar-brand {
            color: #ffffff !important;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand-blue {
            color: #28b9f2;
        }

        .nav-link {
            color: #cbd5e1 !important;
            font-size: 16px;
            font-weight: 600;
            position: relative;
            transition: color 0.2s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #ffffff !important;
        }

        .nav-link.active::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            background: #28b9f2;
            border-radius: 50%;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
        }

        .get-started {
            background: #086bfa;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 13px 24px;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        .get-started:hover {
            background: #0059d6;
            color: #ffffff;
        }

        /* Card Styles */
        .journey-card {
            background: #ffffff;
            color: #111827;
            border-radius: 1rem;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .skills-text {
            color: #0d6efd;
            font-weight: 500;
        }

        .advice-text {
            font-style: italic;
            color: #64748b;
        }
    </style>
</head>

<body>

    <!-- STANDARDIZED NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark py-3" style="background: #050c19; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
        <div class="container" style="max-width: 1600px;">
            
            <!-- Left: Logo -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <!-- The exact SVG Icon from your image -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#28b9f2" style="width: 32px; height: 32px;">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                <!-- The TraceNG Text -->
                <span style="color: #ffffff; font-weight: 800; font-size: 30px; letter-spacing: -1px;">
                    Trace<span style="color: #28b9f2;">NG</span>
                </span>
            </a>

            <!-- Mobile Toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Center: Links & Right: Buttons -->
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav mx-auto gap-lg-4 align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link active" href="journeys.html">Archive</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <a href="auth.html?mode=login" class="nav-link" style="font-weight: 600; color: #cbd5e1;">Login</a>
                    <a href="auth.html?mode=signup" class="btn get-started" style="background: #086bfa; color: #ffffff; border-radius: 12px; padding: 13px 24px; font-weight: 700;">Get Started &rarr;</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <h1 class="fw-bold mb-4">Community Journeys</h1>
        <p class="text-white-50 mb-5">Real stories from Nigerian graduates navigating their career paths.</p>

        <!-- Cards Container -->
        <div id="journeysContainer" class="row g-4">
            <div class="text-white-50">Loading journeys from database...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadJourneys() {
            const container = document.getElementById('journeysContainer');

            try {
                const response = await fetch('https://traceng-api.onrender.com/api/journeys');
                const journeys = await response.json();

                if (journeys.length === 0) {
                    container.innerHTML = '<div class="text-white-50">No journeys have been shared yet. Be the first!</div>';
                    return;
                }

                container.innerHTML = journeys.map(journey => `
                    <div class="col-md-6 col-lg-4">
                        <div class="journey-card p-4 shadow-sm">
                            <h5 class="fw-bold mb-1">${journey.fullName}</h5>
                            <p class="text-muted small mb-3">${journey.currentRole} at ${journey.company}</p>
                            
                            <p class="small mb-3">
                                <strong>Studied:</strong> ${journey.courseStudied} <br> 
                                <strong>Uni:</strong> ${journey.university}
                            </p>
                            
                            <p class="small mb-3"><strong>Biggest Challenge:</strong><br> ${journey.biggestChallenge}</p>
                            
                            <p class="small mb-3"><strong>Skills Acquired:</strong><br> <span class="skills-text">${journey.skillsAcquired}</span></p>

                            <p class="small mb-3"><strong>Wish they knew sooner:</strong><br> ${journey.wishKnownSooner}</p>
                            
                            <div class="mt-auto pt-3 border-top">
                                <p class="small mb-1"><strong>Best Advice:</strong></p>
                                <p class="advice-text small mb-0">"${journey.bestAdvice}"</p>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="text-danger">Failed to connect to the server to load journeys.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadJourneys);
    </script>
    <script src="js/trans.js"></script>
</body>

</html>
