<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Started | TraceNG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #071326;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar-brand span {
      color: #0d6efd;
    }

    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-card {
      background: #ffffff;
      color: #111827;
      border-radius: 1.25rem;
      width: 100%;
      max-width: 460px;
      padding: 2.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .auth-tabs {
      background: #f1f5f9;
      border-radius: 999px;
      padding: 0.3rem;
      display: flex;
      margin-bottom: 1.75rem;
    }

    .auth-tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #64748b;
      transition: all 0.2s ease;
    }

    .auth-tab-btn.active {
      background: #0d6efd;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
    }

    .form-label {
      font-weight: 600;
      font-size: 0.875rem;
      color: #334155;
      margin-bottom: 0.35rem;
    }

    .form-control,
    .form-select {
      border-radius: 0.75rem;
      padding: 0.7rem 0.95rem;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }

    .btn-primary-custom {
      background-color: #0d6efd;
      border: none;
      border-radius: 999px;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 1rem;
      width: 100%;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .btn-primary-custom:hover {
      background-color: #0b5ed7;
      transform: translateY(-1px);
    }

    .badge-pill-tag {
      background: rgba(13, 110, 253, 0.12);
      color: #60a5fa;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 0.75rem;
    }
  </style>
</head>

<body>

   <nav class="navbar navbar-expand-lg navbar-dark py-3 border-bottom border-white border-opacity-10">
    <div class="container" style="max-width: 1150px;">
      
      <!-- Logo -->
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#28b9f2" style="width: 32px; height: 32px;">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <span style="color: #ffffff; font-weight: 800; font-size: 26px; letter-spacing: -1px;">Trace<span style="color: #28b9f2;">NG</span></span>
      </a>

      <!-- Simple Right Side -->
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="text-white-50 text-decoration-none small fw-semibold">
          &larr; Back to Home
        </a>
      </div>
      
    </div>
  </nav>
  <!-- Centered Auth Container -->
  <main class="auth-wrapper">
    <div class="w-100" style="max-width: 460px;">
      <div class="text-center mb-3">
        <span class="badge-pill-tag">🇳🇬 Student &amp; Graduate Portal</span>
        <h1 class="h3 fw-bold mb-1" id="authHeaderTitle">Create your TraceNG account</h1>
        <p class="text-white-50 small mb-0" id="authHeaderSub">Unlock your personalized career gap map and track your
          progress.</p>
      </div>

      <div class="auth-card">
        <!-- Switcher Tabs -->
        <div class="auth-tabs">
          <button type="button" class="auth-tab-btn active" id="tabSignup" onclick="switchAuthMode('signup')">Sign
            Up</button>
          <button type="button" class="auth-tab-btn" id="tabLogin" onclick="switchAuthMode('login')">Log In</button>
        </div>

        <!-- Alert Banner for Feedback -->
        <div id="authAlert" class="alert d-none rounded-3 py-2 px-3 small" role="alert"></div>

        <!-- SIGN UP FORM -->
        <form id="signupForm">
          <div class="mb-3">
            <label for="signupName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="signupName" placeholder="e.g. Chinedu Okafor" required />
          </div>

          <div class="mb-3">
            <label for="signupEmail" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="signupEmail" placeholder="you@university.edu.ng" required />
          </div>

          <div class="row g-2 mb-3">
            <!-- NEW CODE -->
            <div class="col-7">
              <label for="signupCourse" class="form-label">Course of Study</label>
              <input type="text" class="form-control" id="signupCourse" placeholder="e.g. Computer Science" required />
            </div>
            <div class="col-5">
              <label for="signupLevel" class="form-label">Current Status</label>
              <select class="form-select" id="signupLevel" required>
                <option value="100L-200L">100L – 200L</option>
                <option value="300L-400L" selected>300L – 400L</option>
                <option value="Final Year">Final Year</option>
                <option value="NYSC / Grad">NYSC / Grad</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label for="signupPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="signupPassword" placeholder="Minimum 6 characters"
              minlength="6" required />
          </div>

          <button type="submit" class="btn btn-primary btn-primary-custom">
            Create Account &amp; Check Gap Map &rarr;
          </button>
        </form>

        <!-- LOG IN FORM -->
        <form id="loginForm" class="d-none">
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="loginEmail" placeholder="you@university.edu.ng" required />
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
              <label for="loginPassword" class="form-label">Password</label>
              <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
            </div>
            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required />
          </div>

          <button type="submit" class="btn btn-primary btn-primary-custom">
            Log In to TraceNG &rarr;
          </button>
        </form>
      </div>
    </div>
  </main>

  <script>
    const signupForm = document.getElementById('signupForm');
    const loginForm = document.getElementById('loginForm');
    const tabSignup = document.getElementById('tabSignup');
    const tabLogin = document.getElementById('tabLogin');
    const authHeaderTitle = document.getElementById('authHeaderTitle');
    const authHeaderSub = document.getElementById('authHeaderSub');
    const authAlert = document.getElementById('authAlert');

    function switchAuthMode(mode) {
      authAlert.classList.add('d-none');
      if (mode === 'login') {
        signupForm.classList.add('d-none');
        loginForm.classList.remove('d-none');
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        authHeaderTitle.textContent = 'Welcome back to TraceNG';
        authHeaderSub.textContent = 'Log in to view your saved career roadmaps and gap map.';
      } else {
        loginForm.classList.add('d-none');
        signupForm.classList.remove('d-none');
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
        authHeaderTitle.textContent = 'Create your TraceNG account';
        authHeaderSub.textContent = 'Unlock your personalized career gap map and track your progress.';
      }
    }

    // Automatically switch to login if URL has ?mode=login
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'login') {
      switchAuthMode('login');
    }

    function showFeedback(message, isSuccess = true) {
      authAlert.textContent = message;
      authAlert.className = `alert rounded-3 py-2 px-3 small ${isSuccess ? 'alert-success' : 'alert-danger'}`;
      authAlert.classList.remove('d-none');
    }

    // ---------------------------------------------------------
    // FIXED: Handle Sign Up Submission (Now sends to backend!)
    // ---------------------------------------------------------
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const userData = {
        name: document.getElementById('signupName').value.trim(),
        email: document.getElementById('signupEmail').value.trim(),
        course: document.getElementById('signupCourse').value,
        level: document.getElementById('signupLevel').value,
        password: document.getElementById('signupPassword').value // Added password
      };

      try {
        // Change this URL if your backend register route is different
        const response = await fetch('http://localhost:5000/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        });

        const data = await response.json();

        if (!response.ok) {
          showFeedback(data.error || data.message || 'Registration failed.', false);
          return;
        }

        // Save token and user data from the backend response
        if (data.token) localStorage.setItem('traceng_token', data.token);
        if (data.user) localStorage.setItem('traceng_user', JSON.stringify(data.user));

        showFeedback('Account created successfully! Redirecting...');
        setTimeout(() => {
          window.location.href = `gapmap.html?course=${encodeURIComponent(userData.course)}&route=0`;
        }, 900);

      } catch (err) {
        console.error(err);
        showFeedback('Unable to connect to TraceNG server.', false);
      }
    });

    // ---------------------------------------------------------
    // Handle Log In Submission (Already correctly connects)
    // ---------------------------------------------------------
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showFeedback(data.error || 'Invalid credentials. Access denied.', false);
          return;
        }

        // Save secure token and user session
        localStorage.setItem('traceng_token', data.token);
        localStorage.setItem('traceng_user', JSON.stringify(data.user));

        showFeedback('Secure login successful! Opening your dashboard...');
        setTimeout(() => {
          window.location.href = `gapmap.html?course=${encodeURIComponent(data.user.course)}&route=0`;
        }, 900);

      } catch (err) {
        console.error(err);
        showFeedback('Unable to connect to TraceNG server.', false);
      }
    });
  </script>
  <script src="js/trans.js"></script>
</body>

</html>
